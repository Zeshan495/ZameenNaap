name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you press "Run workflow" on GitHub

permissions:
  contents: write           # needed to create the Release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use release signing key (if you added it)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "ZameenNaap-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ZameenNaap-apk
          path: ZameenNaap-*.apk

      - name: Publish on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Zameen Naap v1.${{ github.run_number }}
          body: |
            Download the APK below and install it on your Android phone (Android 7+).
            زمین ناپ: نیچے سے APK ڈاؤن لوڈ کر کے انسٹال کریں۔
          files: ZameenNaap-*.apk
          make_latest: true
